<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archives Familiales</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Archives Familiales</h1>
  <input id="search" type="text" placeholder="Rechercher (titre, année, personne)…">

  <!-- Avertissement sur la qualité de prévisualisation -->
  <p id="warning" class="warning">
    En cliquant sur une vidéo, vous pourrez voir une prévisualisation avec une qualité très médiocre.
    Pour voir la vidéo en qualité originale, nettement plus regardable, il vous faudra télécharger le fichier.
  </p>
</header>



<main>
<div id="gallery" class="gallery"></div>
</main>


<div id="lightbox" class="lightbox hidden">
<div class="lightbox-content">
<span id="closeBtn" class="close">&times;</span>
<h2 id="videoTitle"></h2>
<div id="videoPlayerContainer"></div>
<a id="downloadBtn" class="download" href="#" target="_blank">Télécharger l’original haute qualité</a>
</div>
</div>


<script src="app.js"></script>
</body>

</html>
